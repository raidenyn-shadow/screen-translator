name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing configuration
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for variable in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing release signing secret: $variable. See docs/ci.md."
              exit 1
            fi
          done

      - name: Bump patch version and Android version code
        id: version
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          version=$(python3 .github/scripts/bump_version.py app/build.gradle.kts)
          echo "name=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/v$version" >/dev/null 2>&1; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi

      - name: Prepare release candidate commit
        id: candidate
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts
          git commit -m "chore: release $VERSION"
          branch="release-candidate/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git push origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Test, lint, and build release
        run: ./gradlew :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease --no-daemon

      - name: Sign and verify release APK
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$keystore"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$build_tools/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "screen-translator-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify --verbose --print-certs "screen-translator-$VERSION.apk"

      - name: Save APK for recovery if publishing fails
        uses: actions/upload-artifact@v4
        with:
          name: screen-translator-${{ steps.version.outputs.name }}-release
          path: screen-translator-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error

      - name: Record verified checks and push version bump and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
            -f state=success -f context='Tests and lint' \
            -f description='Release candidate passed versioning tests, both unit-test suites and both lints' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git tag -a "v$VERSION" -m "Release $VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          gh release create "v$VERSION" "screen-translator-$VERSION.apk" \
            --verify-tag --title "Screen Translator $VERSION" --generate-notes

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-reports
          path: app/build/reports/
          retention-days: 14

      - name: Delete temporary release branch
        if: always() && steps.candidate.outputs.branch != ''
        env:
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: git push origin --delete "$BRANCH"
